name: ALMA Production Release

on:
  workflow_dispatch:

concurrency:
  group: alma-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-migrate-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require production release secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from the GitHub production environment."
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Validate sell-ready release
        run: |
          npm run check:encoding
          npm run onboarding:check
          npm run business-office:check
          npm run office-payments:check
          npm run managed-office:check
          npm run sell-ready:check
          npx tsc --noEmit
          npm run lint

      - name: Pull Vercel production settings
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Link production Supabase
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Review production migrations
        run: npx supabase db push --dry-run

      - name: Apply production migrations
        run: npx supabase db push

      - name: Deploy production artifact
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.seaintalma.com/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.seaintalma.com/login >/dev/null
